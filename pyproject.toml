[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "1.5.0"
description = "本地音频分析工具：元数据 + 频谱图可视化"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "mutagen>=1.47",
    "librosa>=0.10",
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyfftw>=0.14",
    "av>=12.0",
    "pyloudnorm>=0.1.0",
    "sounddevice>=0.4",
    "PyOpenGL>=3.1",
]

[project.gui-scripts]
spectra = "spectra.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
exclude = [".claude", "build", "dist"]
